[project]
name = "excel-unprotector-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cliff", email = "hzf510920@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32.0",
]

[project.scripts]
excel-unprotector-server = "excel_unprotector_server:main"

[tool.ruff.lint.per-file-ignores]
# 测试脚本需要捕获所有异常以记录失败用例
"run_tests.py" = ["BLE001"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
